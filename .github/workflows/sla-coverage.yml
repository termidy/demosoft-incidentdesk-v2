name: SLA coverage

on:
  pull_request:
    paths:
      - incidentdesk/sla.py
      - tests/unit/test_sla.py

jobs:
  sla-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:16.10
        env:
          POSTGRES_USER: incidentdesk
          POSTGRES_PASSWORD: incidentdesk
          POSTGRES_DB: incidentdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentdesk"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://incidentdesk:incidentdesk@localhost:5432/incidentdesk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=incidentdesk --cov-report=term --cov-report=xml
      - name: Coverage gate for the SLA rules
        run: coverage report --include=incidentdesk/sla.py --fail-under=90
